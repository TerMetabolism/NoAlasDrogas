[project]
name = "noalasdrogas"
version = "0.1.0"
description = "Publicación diaria de vídeos en TikTok con su API oficial"
requires-python = ">=3.12"
dependencies = ["httpx>=0.27"]

[project.scripts]
noalasdrogas = "noalasdrogas.cli:main"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
testpaths = ["tests"]
